principles:
  - name: Visibility
    description: Use the executed partner agreement's reporting and reconciliation schedule to track
      consumption and fees. No public usage API is exposed.
  - name: Allocation
    description: Allocate fees against the consuming product line through the bilateral invoice; reference
      partner_id or account_id columns where supplied.
  - name: Optimization
    description: Renegotiation and product fit are the primary cost levers; HTLF/UMB does not publish
      tiered price breaks.
  - name: Accountability
    description: Assign a relationship owner who handles the bilateral contract, fee schedule, and
      compliance attestations.
domains:
  - name: Understand Usage and Cost
    capabilities:
      - Allocation
      - Reporting and Analytics
  - name: Quantify Business Value
    capabilities:
      - Planning and Estimating
      - Budgeting
  - name: Optimize Usage and Cost
    capabilities:
      - Licensing and SaaS
  - name: Manage the FinOps Practice
    capabilities:
      - Invoicing and Chargeback
      - Intersecting Disciplines
meters:
