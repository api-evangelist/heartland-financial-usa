description: >-
  Heartland Financial USA, Inc. (HTLF) was a Denver, Colorado bank holding company — formerly
  headquartered in Dubuque, Iowa — that operated a multi-charter family of community banks across
  twelve states, including Dubuque Bank and Trust, Illinois Bank & Trust, Wisconsin Bank & Trust,
  New Mexico Bank & Trust, Arizona Bank & Trust, Rocky Mountain Bank, Citywide Banks, Minnesota
  Bank & Trust, Premier Valley Bank, First Bank & Trust, Bank of Blue Valley and Signature Bank of
  Arkansas. Its business was commercial and retail banking, treasury management, and wealth
  services delivered through branches and third-party core banking platforms rather than through a
  developer program. HTLF never published a developer portal, API reference, SDK, or
  machine-readable contract of any kind. UMB Financial Corporation completed its all-stock
  acquisition of HTLF on January 31, 2025 — the largest in UMB's history — and completed the
  systems and brand conversion of every former HTLF divisional bank in October 2025, at which
  point the HTLF brand ceased to exist. The htlf.com edge configuration has since been
  decommissioned. This profile is retained as a historical record; any banking API surface for
  these institutions now lives with UMB and is tracked separately under the UMB Bank profile.
