source: >-
  Searched every host this record knows for published rate limits, response headers or a
  developer reference and found nothing served at all. Heartland Financial USA was acquired by
  UMB Financial Corporation (closed 2025-01-31, brand and systems conversion completed October
  2025); htlf.com answers HTTP 400 to every path from a decommissioned Akamai configuration and
  api.htlf.com / developer.htlf.com do not resolve.
