notes: >-
  HONEST ZERO. There is no API, so there are no rate limits, no RateLimit-*/X-RateLimit-*
  response headers and no documented exhaustion status code to record. A previous bulk-sweep
  revision asserted a "Bilateral Partner Limit" tier; that tier was generated rather than
  observed and has been removed — nothing HTLF published ever described a partner API program.
